[workspace]
members = [
    "crates/hunter-core",
    "crates/hunter-decoder",
    "crates/hunter-flags",
    "crates/hunter-parser",
    "crates/hunter-types",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
base64 = "0.22"
blake3 = "1.8"
data-encoding = "2.9"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
