name: Release candidate

on:
  push:
    branches:
      - release/0.1.0

permissions: {}

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate RC2
    if: github.ref == 'refs/heads/release/0.1.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the release branch
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends diffoscope podman

      - name: Prepare pinned release images
        run: |
          . release/build-environment.env
          scripts/podman-release.sh pull "$DEBIAN_IMAGE"
          scripts/podman-release.sh pull "$KALI_IMAGE"
          scripts/build-release-container.sh

      - name: Repeat complete source and native gates
        run: |
          scripts/podman-release.sh run --rm \
            --security-opt label=disable \
            --volume "$PWD:/workspace:rw" \
            --workdir /workspace \
            "localhost/ctf-hunter-build:0.1.0-bookworm" \
            scripts/run-ci-gates.sh

      - name: Reclaim source-gate build space
        run: scripts/reclaim-release-space.sh

      - name: Build reproducible RC2 packages
        run: scripts/build-release-candidate.sh

      - name: Validate package lifecycle and BTF diagnostics
        run: scripts/test-release-candidate.sh

      - name: Attest candidate package provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            artifacts/release-candidate/build-a/ctf-hunter_0.1.0~rc2-1_amd64.deb
            artifacts/release-candidate/build-a/ctf-hunter-dbgsym_0.1.0~rc2-1_amd64.deb

      - name: Attest candidate SBOM
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: artifacts/release-candidate/build-a/ctf-hunter_0.1.0~rc2-1_amd64.deb
          sbom-path: artifacts/release-candidate/build-a/ctf-hunter_0.1.0~rc2-1_amd64.spdx.json

      - name: Upload exact candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            artifacts/release-candidate/build-a/ctf-hunter_0.1.0~rc2-1_amd64.deb
            artifacts/release-candidate/build-a/ctf-hunter-dbgsym_0.1.0~rc2-1_amd64.deb
            artifacts/release-candidate/build-a/ctf-hunter_0.1.0~rc2-1_amd64.buildinfo
            artifacts/release-candidate/build-a/ctf-hunter_0.1.0~rc2-1_amd64.changes
            artifacts/release-candidate/build-a/ctf-hunter_0.1.0~rc2-1_amd64.spdx.json
            artifacts/release-candidate/build-a/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  stage-draft:
    name: Stage protected draft prerelease
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-candidate
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Verify protected environment configuration
        env:
          CTF_HUNTER_RC_STAGING: ${{ vars.CTF_HUNTER_RC_STAGING }}
        run: test "$CTF_HUNTER_RC_STAGING" = enabled

      - name: Check out release notes and verification policy
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the validated candidate bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ github.sha }}
          path: release-artifacts

      - name: Recheck checksums and package identity
        run: |
          (cd release-artifacts && sha256sum --check SHA256SUMS)
          python3 scripts/verify-release-artifacts.py release-artifacts
          python3 scripts/verify-debian-package.py \
            --expected-version '0.1.0~rc2-1' \
            release-artifacts/ctf-hunter_0.1.0~rc2-1_amd64.deb

      - name: Verify public candidate attestations
        if: github.event.repository.visibility == 'public'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signer="github.com/$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml"
          for package in release-artifacts/*.deb; do
            gh attestation verify "$package" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --source-ref "$GITHUB_REF"
          done

      - name: Create or verify the immutable RC2 draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v0.1.0-rc2
          tag_api="repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
          if ! tag_target=$(gh api "$tag_api" \
            --jq '.object.type + " " + .object.sha' 2>/dev/null); then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="$GITHUB_SHA" >/dev/null
            tag_target=$(gh api "$tag_api" \
              --jq '.object.type + " " + .object.sha')
          fi
          test "$tag_target" = "commit $GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
            release_target=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json targetCommitish --jq .targetCommitish)
            if test "$release_target" != "$GITHUB_SHA"; then
              test -z "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[].name')"
              gh release edit "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --verify-tag
            fi
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --verify-tag \
              --draft --prerelease \
              --title "CTF Hunter 0.1.0 RC2" \
              --notes-file docs/releases/0.1.0-rc2.md
          fi
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          existing=$(gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for artifact in release-artifacts/*; do
            name=${artifact##*/}
            if grep -Fxq "$name" <<<"$existing"; then
              comparison="$RUNNER_TEMP/existing-$name"
              gh release download "$tag" \
                --repo "$GITHUB_REPOSITORY" --pattern "$name" --output "$comparison"
              cmp -- "$artifact" "$comparison"
            else
              gh release upload "$tag" "$artifact" --repo "$GITHUB_REPOSITORY"
            fi
          done
