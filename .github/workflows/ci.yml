name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy and change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_native: ${{ steps.scope.outputs.run_native }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release and workflow policy
        run: |
          python3 scripts/check-release-metadata.py
          python3 scripts/verify-service-lifecycle.py
          python3 scripts/verify-workflows.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          scripts/verify-systemd-units.sh

      - name: Classify pull request changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            python3 scripts/ci-change-scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo 'run_native=true' >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Source and native release gates
    needs: policy
    if: needs.policy.outputs.run_native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install isolated-build prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman

      - name: Validate systemd units on the runner
        run: |
          python3 scripts/verify-service-lifecycle.py
          scripts/verify-systemd-units.sh

      - name: Prepare pinned Debian 12 builder
        run: |
          . release/build-environment.env
          scripts/podman-release.sh pull "$DEBIAN_IMAGE"
          scripts/build-release-container.sh

      - name: Run complete quality gates
        run: |
          . release/build-environment.env
          scripts/podman-release.sh run --rm \
            --security-opt label=disable \
            --volume "$PWD:/workspace:rw" \
            --workdir /workspace \
            "localhost/ctf-hunter-build:0.1.1-bookworm" \
            scripts/run-ci-gates.sh
