name: Draft release

on:
  push:
    tags:
      - v*.*.*

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate immutable release source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out complete tagged history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate tag, merge, and versions
        run: |
          python3 scripts/verify-release-ref.py "$GITHUB_REF_NAME"
          python3 scripts/check-release-metadata.py

  build:
    name: Build and attest release bytes
    needs: validate-source
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install release-test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends diffoscope podman

      - name: Prepare pinned release images
        run: |
          . release/build-environment.env
          scripts/podman-release.sh pull "$DEBIAN_IMAGE"
          scripts/podman-release.sh pull "$KALI_IMAGE"
          scripts/build-release-container.sh

      - name: Repeat complete source and native gates
        run: |
          scripts/podman-release.sh run --rm \
            --security-opt label=disable \
            --volume "$PWD:/workspace:rw" \
            --workdir /workspace \
            "localhost/ctf-hunter-build:0.1.1-bookworm" \
            scripts/run-ci-gates.sh

      - name: Reclaim source-gate build space
        run: scripts/reclaim-release-space.sh

      - name: Build twice and compare packages
        run: scripts/verify-reproducible-build.sh

      - name: Repeat package lifecycle gates
        run: |
          package=artifacts/reproducible/build-a/ctf-hunter_0.1.1-1_amd64.deb
          scripts/test-package-lifecycle.sh "$package"
          scripts/test-btf-failures.sh "$package"

      - name: Generate checksums and SPDX evidence
        run: >-
          scripts/create-release-artifacts.sh
          artifacts/reproducible/build-a

      - name: Attest package build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/reproducible/build-a/ctf-hunter_0.1.1-1_amd64.deb
            artifacts/reproducible/build-a/ctf-hunter-dbgsym_0.1.1-1_amd64.deb

      - name: Attest package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/reproducible/build-a/ctf-hunter_0.1.1-1_amd64.deb
          sbom-path: artifacts/reproducible/build-a/ctf-hunter_0.1.1-1_amd64.spdx.json

      - name: Transfer exact unsigned release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-unsigned-${{ github.run_id }}
          path: |
            artifacts/reproducible/build-a/ctf-hunter_0.1.1-1_amd64.deb
            artifacts/reproducible/build-a/ctf-hunter-dbgsym_0.1.1-1_amd64.deb
            artifacts/reproducible/build-a/ctf-hunter_0.1.1-1_amd64.buildinfo
            artifacts/reproducible/build-a/ctf-hunter_0.1.1-1_amd64.changes
            artifacts/reproducible/build-a/ctf-hunter_0.1.1-1_amd64.spdx.json
            artifacts/reproducible/build-a/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  sign-and-draft:
    name: Sign and stage GitHub draft
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-signing
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Check out complete tagged history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download exact attested release set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-unsigned-${{ github.run_id }}
          path: release-artifacts

      - name: Verify signed source tag
        env:
          TAG_GPG_PUBLIC_KEY: ${{ secrets.TAG_GPG_PUBLIC_KEY }}
          TAG_GPG_FINGERPRINT: ${{ vars.TAG_GPG_FINGERPRINT }}
        run: |
          test -n "$TAG_GPG_PUBLIC_KEY"
          test -n "$TAG_GPG_FINGERPRINT"
          export GNUPGHOME="$RUNNER_TEMP/tag-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$TAG_GPG_PUBLIC_KEY" | gpg --batch --import
          actual=$(printf '%s' "$TAG_GPG_PUBLIC_KEY" | \
            gpg --batch --with-colons --import-options show-only --import | \
            awk -F: '$1 == "fpr" {print $10; exit}')
          test "$actual" = "${TAG_GPG_FINGERPRINT// /}"
          git verify-tag "$GITHUB_REF_NAME"

      - name: Sign immutable checksum manifest
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_GPG_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
        run: |
          test -n "$RELEASE_GPG_PRIVATE_KEY"
          test -n "$RELEASE_GPG_PASSPHRASE"
          test -n "$RELEASE_GPG_FINGERPRINT"
          export GNUPGHOME="$RUNNER_TEMP/release-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          actual=$(printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | \
            gpg --batch --with-colons --import-options show-only --import | \
            awk -F: '$1 == "fpr" {print $10; exit}')
          test "$actual" = "${RELEASE_GPG_FINGERPRINT// /}"
          passphrase_file="$RUNNER_TEMP/release-passphrase"
          trap 'rm -f -- "$passphrase_file"; rm -rf -- "$GNUPGHOME"' EXIT
          printf '%s' "$RELEASE_GPG_PASSPHRASE" >"$passphrase_file"
          chmod 0600 "$passphrase_file"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$passphrase_file" \
            --local-user "$RELEASE_GPG_FINGERPRINT" \
            --armor --detach-sign \
            --output release-artifacts/SHA256SUMS.asc \
            release-artifacts/SHA256SUMS
          gpg --batch --verify \
            release-artifacts/SHA256SUMS.asc \
            release-artifacts/SHA256SUMS
          (cd release-artifacts && sha256sum --check SHA256SUMS)
          rm -f "$passphrase_file"
          rm -rf -- "$GNUPGHOME"
          trap - EXIT

      - name: Verify GitHub provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signer="github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml"
          for package in release-artifacts/*.deb; do
            gh attestation verify "$package" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --source-ref "$GITHUB_REF"
          done

      - name: Create immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --generate-notes \
              --title "CTF Hunter ${GITHUB_REF_NAME#v}"
          fi
          existing=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for artifact in release-artifacts/*; do
            name=${artifact##*/}
            if grep -Fxq "$name" <<<"$existing"; then
              comparison="$RUNNER_TEMP/existing-$name"
              gh release download "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" --pattern "$name" --output "$comparison"
              cmp -- "$artifact" "$comparison"
            else
              gh release upload "$GITHUB_REF_NAME" "$artifact" \
                --repo "$GITHUB_REPOSITORY"
            fi
          done
